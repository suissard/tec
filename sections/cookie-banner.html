<!-- Cookie & Tracking Consent Banner (RGPD / PostHog) -->
<div id="cookie-banner" class="fixed bottom-0 left-0 right-0 z-[60] bg-brand-dark border-t border-white/10 p-4 sm:p-6 backdrop-blur-md shadow-2xl transform translate-y-full transition-transform duration-300 ease-in-out">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div class="text-sm sm:text-base text-gray-300 leading-relaxed">
            <p class="font-medium text-white mb-1 sm:mb-0">Cookies et mesures d’audience</p>
            <p class="text-xs sm:text-sm text-gray-400">
                Nous utilisons des cookies pour mesurer l’audience du site (PostHog) et améliorer votre expérience. Aucune donnée personnelle n’est vendue à des tiers.
            </p>
        </div>
        <div class="flex flex-col sm:flex-row gap-3 justify-end">
            <button type="button" id="cookie-decline" class="px-4 py-2.5 rounded-lg bg-white/5 border border-white/10 text-gray-300 hover:bg-white/10 hover:text-white text-sm font-medium transition-colors">
                Refuser
            </button>
            <button type="button" id="cookie-accept" class="px-4 py-2.5 rounded-lg bg-brand-red text-white hover:bg-brand-redHover text-sm font-medium transition-all shadow glow-red-sm hover:scale-[1.02]">
                Accepter
            </button>
        </div>
    </div>
</div>
