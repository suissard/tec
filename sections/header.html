<!-- ==========================================================================
   HEADER & NAVIGATION
   ========================================================================== -->
<header class="sticky top-0 z-50 bg-brand-dark/95 backdrop-blur-md border-b border-white/10 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-20">

            <!-- Logo -->
            <button onclick="switchTab('accueil')" class="flex items-center gap-3 group text-left">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-brand-red to-black p-0.5 shadow-lg group-hover:scale-105 transition-transform duration-300">
                    <div class="w-full h-full bg-brand-dark rounded-[10px] flex items-center justify-center overflow-hidden">
                        <span class="font-bebas text-2xl tracking-wider text-brand-red group-hover:text-white transition-colors">TEC</span>
                    </div>
                </div>
                <div>
                    <span class="font-bebas text-2xl tracking-wider text-white block leading-none">TOULOUSE</span>
                    <span class="font-rajdhani font-bold text-xs tracking-widest text-brand-red block">ESPORT CONNECT</span>
                </div>
            </button>

            <!-- Navigation Links (Desktop) -->
            <nav class="hidden md:flex items-center gap-8 font-medium text-sm">
                <button onclick="switchTab('accueil')" id="nav-accueil"
                    class="nav-link text-brand-red font-bold relative py-2 transition-colors">Accueil</button>
                <button onclick="switchTab('projet')" id="nav-projet"
                    class="nav-link text-gray-400 hover:text-brand-red py-2 transition-colors">Notre Projet</button>
                <button onclick="switchTab('associations')" id="nav-associations"
                    class="nav-link text-gray-400 hover:text-brand-red py-2 transition-colors">Associations</button>
                <button onclick="switchTab('evenements')" id="nav-evenements"
                    class="nav-link text-gray-400 hover:text-brand-red py-2 transition-colors">Événements</button>
                <button onclick="switchTab('qui-sommes-nous')" id="nav-qui-sommes-nous"
                    class="nav-link text-gray-400 hover:text-brand-red py-2 transition-colors">Qui sommes-nous ?</button>
            </nav>

            <!-- Header CTA Button -->
            <div class="hidden sm:flex items-center gap-4">
                <button onclick="switchTab('projet'); scrollToAdhesion();"
                    class="relative group inline-flex items-center gap-2 px-5 py-2.5 rounded-lg bg-brand-red text-white font-rajdhani font-bold text-sm tracking-wider uppercase overflow-hidden shadow-lg hover:bg-brand-redHover transition-all duration-300 glow-red-sm hover:scale-105">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>Rejoindre le Réseau</span>
                </button>
            </div>

            <!-- Mobile Menu Toggle Button -->
            <button id="mobile-menu-btn" class="md:hidden p-2 text-gray-400 hover:text-white focus:outline-none" aria-label="Menu principal">
                <i class="fa-solid fa-bars text-2xl"></i>
            </button>
        </div>
    </div>

    <!-- Mobile Dropdown Navigation -->
    <div id="mobile-menu" class="hidden md:hidden bg-brand-cardBg border-b border-brand-cardBorder px-4 pt-2 pb-6 space-y-3">
        <button onclick="switchTab('accueil'); toggleMobileMenu()"
            class="block w-full text-left py-2 text-gray-300 hover:text-brand-red">Accueil</button>
        <button onclick="switchTab('projet'); toggleMobileMenu()"
            class="block w-full text-left py-2 text-gray-300 hover:text-brand-red">Notre Projet</button>
        <button onclick="switchTab('associations'); toggleMobileMenu()"
            class="block w-full text-left py-2 text-gray-300 hover:text-brand-red">Associations</button>
        <button onclick="switchTab('evenements'); toggleMobileMenu()"
            class="block w-full text-left py-2 text-gray-300 hover:text-brand-red">Événements</button>
        <button onclick="switchTab('qui-sommes-nous'); toggleMobileMenu()"
            class="block w-full text-left py-2 text-gray-300 hover:text-brand-red">Qui sommes-nous ?</button>
        <button onclick="switchTab('projet'); toggleMobileMenu(); scrollToAdhesion();"
            class="block w-full text-center mt-4 py-3 bg-brand-red text-white font-bold rounded-lg uppercase tracking-wider">
            Rejoindre le réseau
        </button>
    </div>
</header>
