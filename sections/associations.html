<!-- ==========================================================================

<section id="page-associations" class="page-view">
    <div class="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Header -->
        <div class="text-center max-w-3xl mx-auto mb-12">
            <span class="text-brand-redLight font-rajdhani font-bold text-xs uppercase tracking-widest block mb-2">Les Acteurs du Réseau</span>
            <h2 class="font-bebas text-5xl sm:text-6xl text-white uppercase">Les Associations Membres</h2>
            <p class="text-gray-300 text-sm sm:text-base mt-2">
                Retrouvez toutes les associations affiliées au collectif Toulouse Esport Connect. Cliquez sur leur logo pour découvrir leur fiche d'information détaillée.
            </p>
        </div>

        <!-- Filter Controls -->
        <div class="flex flex-wrap gap-2 justify-center mb-12" id="assoc-filters" role="group" aria-label="Filtrer les associations par catégorie">

                class="assoc-btn active px-5 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all bg-brand-red text-white focus:outline-none focus:ring-2 focus:ring-brand-red">
                Toutes les Associations
            </button>
            <button type="button" onclick="filterAssocLogos('esport', this)"
                class="assoc-btn px-5 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all bg-brand-cardBg text-gray-400 hover:text-white border border-brand-cardBorder focus:outline-none focus:ring-2 focus:ring-brand-red">
                Esport
            </button>
            <button type="button" onclick="filterAssocLogos('versus', this)"
                class="assoc-btn px-5 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all bg-brand-cardBg text-gray-400 hover:text-white border border-brand-cardBorder focus:outline-none focus:ring-2 focus:ring-brand-red">
                Versus Fighting
            </button>
            <button type="button" onclick="filterAssocLogos('retro', this)"

            </button>
            <button type="button" onclick="filterAssocLogos('etudiant', this)"

                Étudiant & Communauté
            </button>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-3 lg:grid-cols-6 gap-6" id="logo-grid">

            <!-- 1. Oserv esport -->
            <button type="button" class="logo-item text-center glass-card rounded-2xl p-6 flex flex-col items-center justify-center gap-3 cursor-pointer group hover:scale-105 hover:border-brand-red focus:border-brand-red focus:ring-2 focus:ring-brand-red focus:outline-none transition-all duration-300 w-full"
                data-cat="esport"
                aria-haspopup="dialog"
                aria-label="Voir la fiche détaillée de Oserv Esport"
                onclick="openModal('Oserv Esport', 'Association et club compétitif toulousain majeur impliqué dans la formation des joueurs, la compétition et l\'événementiel régional.', 'contact@oserv-esport.fr', 'media/oserv-transparent.png', 'League of Legends, Rocket League, Valorant', this)">

                </div>
                <span class="font-bebas text-lg text-white group-hover:text-brand-redLight text-center leading-tight transition-colors">Oserv Esport</span>

                    <img src="media/dragon-transparent.png" alt="Logo Dragon Esport" width="96" height="96" loading="lazy" class="w-full h-full object-contain rounded-xl group-hover:scale-110 transition-transform duration-300">
