<!-- ==========================================================================
   PAGE 4: ÉVÉNEMENTS
   ========================================================================== -->
<section id="page-evenements" class="page-view">
    <div class="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <!-- Section Title -->
        <div class="text-center max-w-3xl mx-auto mb-12">
            <span class="text-brand-redLight font-rajdhani font-bold text-xs uppercase tracking-widest block mb-2">Agenda Esport</span>
            <h2 class="font-bebas text-5xl sm:text-6xl text-white uppercase">Événements & Tournois</h2>
            <p class="text-gray-300 text-sm sm:text-base mt-2">
                Retrouvez les grands rendez-vous esportifs, LANs et tournois organisés par Toulouse Esport Connect et ses associations adhérentes.
            </p>
        </div>

        <!-- Event Cards List -->
        <div class="space-y-6">
            <h3 class="font-bebas text-3xl text-white uppercase mb-6">Prochains Rendez-vous</h3>

            <!-- Filtres catégorie événements -->
            <div class="flex flex-wrap gap-2 mb-6" role="tablist" aria-label="Filtrer les événements par catégorie">
                <button type="button" data-cat="all" class="event-filter-btn px-4 py-2 rounded-xl bg-brand-red text-white font-rajdhani font-bold text-xs uppercase tracking-wider transition-all">Tous</button>
                <button type="button" data-cat="Versus Fighting" class="event-filter-btn px-4 py-2 rounded-xl bg-brand-cardBg text-gray-400 hover:bg-white/10 font-rajdhani font-bold text-xs uppercase tracking-wider transition-all">Versus Fighting</button>
                <button type="button" data-cat="Esport & Communauté" class="event-filter-btn px-4 py-2 rounded-xl bg-brand-cardBg text-gray-400 hover:bg-white/10 font-rajdhani font-bold text-xs uppercase tracking-wider transition-all">Esport</button>
                <button type="button" data-cat="LAN & Gaming" class="event-filter-btn px-4 py-2 rounded-xl bg-brand-cardBg text-gray-400 hover:bg-white/10 font-rajdhani font-bold text-xs uppercase tracking-wider transition-all">LAN & Gaming</button>
                <button type="button" data-cat="Rétrogaming & LAN" class="event-filter-btn px-4 py-2 rounded-xl bg-brand-cardBg text-gray-400 hover:bg-white/10 font-rajdhani font-bold text-xs uppercase tracking-wider transition-all">Rétrogaming</button>
            </div>

            {{EVENTS_LIST}}
        </div>

    </div>
</section>
