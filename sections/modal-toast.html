<!-- ==========================================================================
   INTERACTIVE COMPONENTS: MODAL & TOAST NOTIFICATION
   ========================================================================== -->

<!-- Association Details Modal -->
<div id="assoc-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass-card max-w-md w-full rounded-3xl p-6 border border-brand-red/40 relative shadow-2xl animate-fade-in">
        <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl" aria-label="Fermer la boîte de dialogue">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div id="modal-content">
            <!-- Dynamic Content Injected via JS -->
        </div>
    </div>
</div>

<!-- Toast Notification -->
<div id="toast" class="fixed bottom-6 right-6 z-50 hidden bg-brand-red text-white text-xs font-rajdhani font-bold uppercase tracking-wider px-5 py-3 rounded-xl shadow-2xl glow-red-sm">
    <span id="toast-text">Message transmis !</span>
</div>
